name: FloorplanViewer

options:
  bundleIdPrefix: com.iphoner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  # Assignment-sanctioned "small archive extraction library" for gzip + tar. Pure Swift, no
  # transitive deps. Hand-rolling gzip-header + ustar/pax parsing is a poor use of the timebox.
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    from: "4.8.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Zero-warning contract, enforced mechanically: any Swift warning (including
    # strict-concurrency diagnostics) fails the build instead of relying on a human reading logs.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  FloorplanViewer:
    type: application
    platform: iOS
    sources:
      - path: FloorplanViewer
    dependencies:
      - package: GRDB
      - package: SWCompression
    info:
      # Generated by XcodeGen (git-ignored).
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Floorplan Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Native launch screen: light blueprint logo centered on the dark neutral
        # LaunchBackground. Assets generated by tooling/appicon/generate_assets.py.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSupportsIndirectInputEvents: true
        # Only exempt crypto is used (HTTPS). Skips the export-compliance question on upload.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iphoner.floorplanviewer
        PRODUCT_NAME: FloorplanViewer
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Names the accent so Color.accentColor / the global tint resolve to it.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Colorsets reached via generated symbols: a renamed asset fails the build.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  FloorplanViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FloorplanViewerTests
    dependencies:
      - target: FloorplanViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iphoner.floorplanviewer.tests
        GENERATE_INFOPLIST_FILE: YES
